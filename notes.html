<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Audio Notes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a1a;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.1);
    --text: #e8e0f0;
    --text-dim: #8a80a0;
    --accent: #b388ff;
    --accent-glow: rgba(179,136,255,0.3);
    --rec: #ff5370;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden; -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top, 0);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 20%, rgba(90,50,150,0.15) 0%, transparent 70%);
  }

  .screen { display: none; padding: 20px; position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  .top-bar {
    display: flex; align-items: center; gap: 12px; padding: 20px 0;
  }
  .top-bar h1 { font-size: 22px; font-weight: 300; letter-spacing: 2px; flex: 1; }
  .icon-btn {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); font-size: 20px; cursor: pointer;
    transition: background 0.2s;
  }
  .icon-btn:active { background: rgba(255,255,255,0.15); }
  .icon-btn[disabled] { opacity: 0.3; pointer-events: none; }

  /* Recorder */
  .recorder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    max-width: 460px; margin: 0 auto; width: 100%;
  }

  .wave-box {
    width: 100%; height: 180px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 18px; padding: 14px;
    position: relative; overflow: hidden;
  }
  #wave { width: 100%; height: 100%; display: block; }

  .status-row {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-dim); font-size: 13px; letter-spacing: 1px;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .status-dot.live {
    background: var(--rec);
    box-shadow: 0 0 10px var(--rec);
    animation: blink 1s ease-in-out infinite;
  }
  .status-dot.loud { background: #7cf57c; box-shadow: 0 0 12px #7cf57c; }
  @keyframes blink { 50% { opacity: 0.4; } }

  .timer {
    font-size: 56px; font-weight: 200; letter-spacing: 3px;
    font-variant-numeric: tabular-nums;
  }

  .rec-btn {
    width: 112px; height: 112px; border-radius: 50%;
    border: none; cursor: pointer;
    background: linear-gradient(135deg, rgba(179,136,255,0.35), rgba(120,80,200,0.35));
    border: 1px solid rgba(179,136,255,0.4);
    color: var(--text); font-size: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.2s;
    box-shadow: 0 8px 32px rgba(179,136,255,0.2);
  }
  .rec-btn:active { transform: scale(0.92); }
  .rec-btn.recording {
    background: linear-gradient(135deg, rgba(255,83,112,0.5), rgba(200,50,80,0.5));
    border-color: rgba(255,83,112,0.6);
    box-shadow: 0 8px 32px rgba(255,83,112,0.35);
  }
  .rec-btn .stop-icon {
    width: 30px; height: 30px; border-radius: 4px; background: var(--text);
  }

  .hint { color: var(--text-dim); font-size: 13px; text-align: center; padding: 0 20px; }
  .error { color: var(--rec); font-size: 13px; text-align: center; padding: 0 20px; }

  /* Saved notes list */
  .notes-list {
    flex: 1; display: flex; flex-direction: column; gap: 10px;
    max-width: 460px; margin: 0 auto; width: 100%;
    padding-bottom: 24px;
  }
  .note-item {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .note-head { display: flex; align-items: center; gap: 10px; }
  .note-title { font-size: 15px; flex: 1; font-weight: 400; }
  .note-meta { color: var(--text-dim); font-size: 12px; }
  .note-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
    color: var(--text); padding: 8px 14px; border-radius: 20px;
    font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.2s;
  }
  .chip:active { background: rgba(255,255,255,0.15); }
  .chip.danger { color: var(--rec); }

  .empty {
    color: var(--text-dim); text-align: center; padding: 40px 20px;
    font-size: 14px;
  }

  audio { width: 100%; margin-top: 4px; }

  .tabs {
    display: flex; background: var(--card-bg);
    border: 1px solid var(--card-border); border-radius: 12px;
    padding: 4px; margin-bottom: 20px;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px;
    border-radius: 8px; color: var(--text-dim);
    font-size: 14px; cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active { background: rgba(179,136,255,0.2); color: var(--text); }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div id="main" class="screen active">
  <div class="top-bar">
    <a class="icon-btn" href="index.html" aria-label="Back">&#8592;</a>
    <h1>Audio Notes</h1>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="rec" onclick="switchTab('rec')">Record</div>
    <div class="tab" data-tab="list" onclick="switchTab('list')">Saved <span id="count-badge"></span></div>
  </div>

  <div id="tab-rec" class="recorder">
    <div class="wave-box">
      <canvas id="wave"></canvas>
    </div>

    <div class="status-row">
      <span class="status-dot" id="dot"></span>
      <span id="status">Idle</span>
    </div>

    <div class="timer" id="timer">00:00</div>

    <button class="rec-btn" id="recBtn" onclick="toggleRecord()" aria-label="Record">
      <span id="recIcon">🎙️</span>
    </button>

    <p class="hint" id="hint">Tap the mic to start. Recording keeps going until you tap stop.</p>
    <p class="error" id="error"></p>
  </div>

  <div id="tab-list" class="notes-list" style="display:none;">
    <div id="notes"></div>
  </div>
</div>

<script>
// ---------- IndexedDB helpers ----------
const DB_NAME = 'audio-notes';
const DB_STORE = 'notes';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        db.createObjectStore(DB_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function dbPut(note) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(note);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

async function dbGetAll() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}

async function dbDelete(id) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

// ---------- Recording state ----------
let mediaStream = null;
let mediaRecorder = null;
let audioContext = null;
let analyser = null;
let analyserData = null;
let recordedChunks = [];
let recordingStart = 0;
let timerHandle = null;
let rafHandle = null;
let mimeType = '';
let isRecording = false;

const canvas = document.getElementById('wave');
const ctx = canvas.getContext('2d');
const levels = new Array(120).fill(0);

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 0);

function drawWave() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  // baseline
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();

  const n = levels.length;
  const gap = 2;
  const barW = Math.max(1, (w - gap * (n - 1)) / n);

  for (let i = 0; i < n; i++) {
    const lvl = levels[i];
    const bh = Math.max(2, lvl * (h - 6));
    const x = i * (barW + gap);
    const y = (h - bh) / 2;
    const alpha = 0.35 + lvl * 0.65;
    ctx.fillStyle = isRecording
      ? `rgba(255, 83, 112, ${alpha})`
      : `rgba(179, 136, 255, ${alpha * 0.5})`;
    ctx.fillRect(x, y, barW, bh);
  }
}

function sampleLevel() {
  if (analyser && analyserData) {
    analyser.getByteTimeDomainData(analyserData);
    // RMS
    let sum = 0;
    for (let i = 0; i < analyserData.length; i++) {
      const v = (analyserData[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / analyserData.length);
    const level = Math.min(1, rms * 3);
    levels.push(level);
    if (levels.length > 120) levels.shift();

    const dot = document.getElementById('dot');
    const status = document.getElementById('status');
    if (isRecording) {
      dot.classList.add('live');
      if (level > 0.15) {
        dot.classList.add('loud');
        status.textContent = 'Picking up sound';
      } else {
        dot.classList.remove('loud');
        status.textContent = 'Listening (silent)';
      }
    }
  } else {
    // decay when idle
    levels.push(0);
    if (levels.length > 120) levels.shift();
  }
  drawWave();
  rafHandle = requestAnimationFrame(sampleLevel);
}
rafHandle = requestAnimationFrame(sampleLevel);

function pickMime() {
  const candidates = [
    'audio/mp4',           // Safari iOS
    'audio/aac',
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus'
  ];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function formatElapsed(ms) {
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const mm = String(m).padStart(2, '0');
  const ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function setError(msg) {
  document.getElementById('error').textContent = msg || '';
}

async function startRecording() {
  setError('');
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (err) {
    setError('Microphone permission denied or unavailable.');
    return;
  }

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === 'suspended') await audioContext.resume();
  const source = audioContext.createMediaStreamSource(mediaStream);
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 1024;
  analyserData = new Uint8Array(analyser.fftSize);
  source.connect(analyser);

  mimeType = pickMime();
  try {
    mediaRecorder = mimeType
      ? new MediaRecorder(mediaStream, { mimeType })
      : new MediaRecorder(mediaStream);
  } catch (e) {
    setError('This browser does not support MediaRecorder.');
    cleanupStream();
    return;
  }

  recordedChunks = [];
  mediaRecorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = handleStop;
  mediaRecorder.onerror = e => setError('Recorder error: ' + (e.error?.message || 'unknown'));
  mediaRecorder.start(1000); // gather 1s chunks so long recordings survive

  recordingStart = Date.now();
  isRecording = true;
  updateUIForRecording(true);

  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    document.getElementById('timer').textContent =
      formatElapsed(Date.now() - recordingStart);
  }, 250);
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

async function handleStop() {
  const duration = Date.now() - recordingStart;
  const blob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
  recordedChunks = [];
  cleanupStream();

  const id = 'note-' + Date.now();
  const ext = extensionFor(blob.type);
  const now = new Date();
  const title = now.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const note = {
    id,
    title,
    createdAt: now.toISOString(),
    duration,
    blob,
    mime: blob.type,
    filename: `audio-note-${id}.${ext}`
  };
  try {
    await dbPut(note);
  } catch (e) {
    setError('Could not save note: ' + e.message);
  }

  isRecording = false;
  updateUIForRecording(false);
  document.getElementById('timer').textContent = '00:00';
  await renderNotes();
  switchTab('list');
}

function cleanupStream() {
  try { mediaRecorder && mediaRecorder.stream && null; } catch {}
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  if (audioContext) {
    audioContext.close().catch(() => {});
    audioContext = null;
  }
  analyser = null;
  analyserData = null;
  clearInterval(timerHandle);
}

function updateUIForRecording(rec) {
  const btn = document.getElementById('recBtn');
  const icon = document.getElementById('recIcon');
  const hint = document.getElementById('hint');
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');

  if (rec) {
    btn.classList.add('recording');
    icon.innerHTML = '<span class="stop-icon"></span>';
    hint.textContent = 'Recording will continue until you tap stop.';
    dot.classList.add('live');
    status.textContent = 'Recording…';
  } else {
    btn.classList.remove('recording');
    icon.textContent = '🎙️';
    hint.textContent = 'Tap the mic to start. Recording keeps going until you tap stop.';
    dot.classList.remove('live', 'loud');
    status.textContent = 'Idle';
  }
}

function toggleRecord() {
  if (isRecording) stopRecording();
  else startRecording();
}

function extensionFor(mime) {
  if (!mime) return 'webm';
  if (mime.includes('mp4') || mime.includes('aac')) return 'm4a';
  if (mime.includes('webm')) return 'webm';
  if (mime.includes('ogg')) return 'ogg';
  if (mime.includes('wav')) return 'wav';
  return 'audio';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tab-rec').style.display = tab === 'rec' ? '' : 'none';
  document.getElementById('tab-list').style.display = tab === 'list' ? '' : 'none';
  if (tab === 'list') renderNotes();
}

async function renderNotes() {
  const list = document.getElementById('notes');
  const notes = (await dbGetAll()).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  document.getElementById('count-badge').textContent = notes.length ? `(${notes.length})` : '';

  if (notes.length === 0) {
    list.innerHTML = '<p class="empty">No notes yet. Tap <b>Record</b> to create one.</p>';
    return;
  }

  list.innerHTML = '';
  for (const n of notes) {
    const url = URL.createObjectURL(n.blob);
    const div = document.createElement('div');
    div.className = 'note-item';
    div.innerHTML = `
      <div class="note-head">
        <div class="note-title">${escapeHtml(n.title)}</div>
        <div class="note-meta">${formatElapsed(n.duration)}</div>
      </div>
      <audio controls preload="none" src="${url}"></audio>
      <div class="note-actions">
        <a class="chip" href="${url}" download="${escapeHtml(n.filename)}">⬇️ Download</a>
        <button class="chip" data-id="${n.id}" data-act="share">📤 Share</button>
        <button class="chip" data-id="${n.id}" data-act="rename">✏️ Rename</button>
        <button class="chip danger" data-id="${n.id}" data-act="delete">🗑️ Delete</button>
      </div>
    `;
    list.appendChild(div);
  }

  list.querySelectorAll('button.chip').forEach(btn => {
    btn.addEventListener('click', () => noteAction(btn.dataset.id, btn.dataset.act));
  });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function noteAction(id, act) {
  const all = await dbGetAll();
  const note = all.find(n => n.id === id);
  if (!note) return;

  if (act === 'delete') {
    if (!confirm('Delete this note?')) return;
    await dbDelete(id);
    await renderNotes();
    return;
  }
  if (act === 'rename') {
    const t = prompt('New title:', note.title);
    if (t && t.trim()) {
      note.title = t.trim();
      await dbPut(note);
      await renderNotes();
    }
    return;
  }
  if (act === 'share') {
    const file = new File([note.blob], note.filename, { type: note.mime || 'audio/webm' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: note.title });
      } catch { /* user cancelled */ }
    } else {
      alert('Sharing not supported in this browser. Use the Download button and share from Files.');
    }
  }
}

// Initial render + feature check
(async function init() {
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setError('This browser does not support audio recording.');
    document.getElementById('recBtn').disabled = true;
  }
  await renderNotes();
})();

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
