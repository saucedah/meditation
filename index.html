<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meditate">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Meditate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a1a;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.1);
    --text: #e8e0f0;
    --text-dim: #8a80a0;
    --accent: #b388ff;
    --accent-glow: rgba(179,136,255,0.3);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .screen { display: none; min-height: 100vh; min-height: 100dvh; padding: 20px; padding-top: env(safe-area-inset-top, 20px); }
  .screen.active { display: flex; flex-direction: column; }

  .bg-glow {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, rgba(90,50,150,0.15) 0%, transparent 70%);
  }

  .screen > * { position: relative; z-index: 1; }

  /* Home Screen */
  .home-header { text-align: center; padding: 60px 0 40px; }
  .home-header h1 { font-size: 32px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
  .home-header p { color: var(--text-dim); margin-top: 8px; font-size: 14px; letter-spacing: 2px; }
  .lotus { font-size: 60px; margin-bottom: 16px; display: block; }

  .home-cards { display: flex; flex-direction: column; gap: 20px; max-width: 400px; margin: 0 auto; width: 100%; }
  .home-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 20px; padding: 32px 24px; text-align: center;
    cursor: pointer; transition: all 0.3s ease;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .home-card:active { transform: scale(0.97); background: rgba(255,255,255,0.1); }
  .home-card .icon { font-size: 48px; margin-bottom: 12px; display: block; }
  .home-card h2 { font-size: 22px; font-weight: 400; letter-spacing: 2px; }
  .home-card p { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

  /* List Header */
  .list-header {
    display: flex; align-items: center; padding: 20px 0 24px; gap: 16px;
  }
  .back-btn {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; width: 44px; height: 44px; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
    color: var(--text); font-size: 20px; flex-shrink: 0;
    transition: background 0.2s;
  }
  .back-btn:active { background: rgba(255,255,255,0.15); }
  .list-header h1 { font-size: 24px; font-weight: 300; letter-spacing: 2px; }

  /* Player Screen */
  .player { align-items: center; justify-content: center; text-align: center; }
  .player-visual {
    width: 220px; height: 220px; border-radius: 50%; margin: 0 auto 32px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    position: relative;
  }
  .player-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(179,136,255,0.2);
  }
  .player-ring.pulse {
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.15); opacity: 0.8; }
  }
  .player-ring:nth-child(2) { animation-delay: -1.3s; }
  .player-ring:nth-child(3) { animation-delay: -2.6s; }

  .player-emoji { font-size: 64px; position: relative; z-index: 1; }

  .player-title { font-size: 22px; font-weight: 300; letter-spacing: 2px; margin-bottom: 4px; padding: 0 10px; }
  .player-subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 40px; }

  .timer { font-size: 56px; font-weight: 200; letter-spacing: 4px; margin-bottom: 40px; font-variant-numeric: tabular-nums; }

  .controls { display: flex; gap: 24px; align-items: center; justify-content: center; margin-bottom: 24px; }
  .ctrl-btn {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 50%; width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 28px; color: var(--text);
    transition: all 0.2s;
  }
  .ctrl-btn:active { transform: scale(0.9); }
  .ctrl-btn.play {
    width: 80px; height: 80px; font-size: 32px;
    background: linear-gradient(135deg, rgba(179,136,255,0.3), rgba(120,80,200,0.3));
    border-color: rgba(179,136,255,0.4);
  }

  .player-back {
    position: absolute; top: 20px; left: 20px;
    top: calc(env(safe-area-inset-top, 20px) + 10px);
  }

  /* Volume */
  .volume-row {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    margin-bottom: 20px; color: var(--text-dim);
  }
  .volume-row input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 140px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.15); outline: none;
  }
  .volume-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }

  /* Loading */
  .loading { color: var(--text-dim); font-size: 14px; margin-top: 8px; }

  .med-spiritual { background: rgba(156,39,176,0.2); color: #9c27b0; }
  .med-quantum { background: rgba(100,149,237,0.2); color: #6495ed; }
</style>
</head>
<body>
<div class="bg-glow"></div>

<!-- HOME SCREEN -->
<div id="home" class="screen active">
  <div class="home-header">
    <span class="lotus">🪷</span>
    <h1>Meditate</h1>
    <p>Find your inner peace</p>
  </div>
  <div class="home-cards">
    <div class="home-card" onclick="selectSession('limpieza')">
      <span class="icon">✨</span>
      <h2>Limpieza Energetica</h2>
      <p>Mantras y canticos de elevacion espiritual</p>
    </div>
    <div class="home-card" onclick="selectSession('cuantica')">
      <span class="icon">🧘</span>
      <h2>Meditacion Cuantica</h2>
      <p>Viaje al interior con Metodo Wim Hof</p>
    </div>
  </div>
</div>

<!-- PLAYER -->
<div id="player" class="screen player">
  <div class="back-btn player-back" onclick="stopAndBack()">&#8592;</div>
  <div class="player-visual">
    <div class="player-ring pulse"></div>
    <div class="player-ring pulse"></div>
    <div class="player-ring pulse"></div>
    <span class="player-emoji" id="p-emoji"></span>
  </div>
  <h2 class="player-title" id="p-title"></h2>
  <p class="player-subtitle" id="p-sub"></p>
  <div class="timer" id="p-timer">00:00</div>
  <div class="controls">
    <div class="ctrl-btn" onclick="restartAudio()">↺</div>
    <div class="ctrl-btn play" id="play-btn" onclick="togglePlay()">▶</div>
    <div class="ctrl-btn" onclick="stopAndBack()">■</div>
  </div>
  <div class="volume-row">
    <span>🔈</span>
    <input type="range" min="0" max="100" value="80" id="vol-slider" oninput="setVolume(this.value)">
    <span>🔊</span>
  </div>
  <p class="loading" id="loading-msg"></p>
</div>

<script>
const sessions = {
  limpieza: {
    name: 'Limpieza Energetica',
    desc: 'Mantras y canticos de elevacion espiritual',
    emoji: '✨',
    file: 'audio/LIMPIEZA ENERGETICA Mantras  y canticos de Elevación Espiritual. Elimina Energía Negativa y Bloqueos.mp3'
  },
  cuantica: {
    name: 'Meditacion Cuantica',
    desc: 'Viaje al interior con Metodo Wim Hof',
    emoji: '🧘',
    file: 'audio/Meditación Cuántica –Viaje al Interior con Método Wim Hof ｜Conecta con tus cuerpos ｜Yessy Hiolística.mp3'
  }
};

let currentSession = null;
let audio = null;
let timerInterval = null;
let isPlaying = false;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function formatTime(seconds) {
  if (isNaN(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function selectSession(id) {
  currentSession = sessions[id];

  document.getElementById('p-emoji').textContent = currentSession.emoji;
  document.getElementById('p-title').textContent = currentSession.name;
  document.getElementById('p-sub').textContent = currentSession.desc;
  document.getElementById('p-timer').textContent = '00:00';
  document.getElementById('play-btn').textContent = '▶';
  document.getElementById('loading-msg').textContent = '';

  // Stop any previous audio
  if (audio) {
    audio.pause();
    audio.src = '';
  }

  // Create new audio element
  audio = new Audio(currentSession.file);
  audio.volume = document.getElementById('vol-slider').value / 100;
  audio.loop = true;
  audio.preload = 'auto';

  // Update timer display as audio plays
  audio.addEventListener('timeupdate', () => {
    document.getElementById('p-timer').textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    // loop is on, but just in case
    isPlaying = false;
    document.getElementById('play-btn').textContent = '▶';
  });

  isPlaying = false;
  showScreen('player');
}

function togglePlay() {
  if (!audio || !currentSession) return;

  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    document.getElementById('play-btn').textContent = '▶';
  } else {
    document.getElementById('loading-msg').textContent = 'Loading audio...';
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        document.getElementById('loading-msg').textContent = '';
        isPlaying = true;
        document.getElementById('play-btn').textContent = '⏸';
      }).catch(err => {
        document.getElementById('loading-msg').textContent = 'Tap play again';
        isPlaying = false;
      });
    }
  }
}

function restartAudio() {
  if (audio) {
    audio.currentTime = 0;
    document.getElementById('p-timer').textContent = '00:00';
    if (isPlaying) {
      audio.play();
    }
  }
}

function setVolume(val) {
  if (audio) {
    audio.volume = val / 100;
  }
}

function stopAndBack() {
  if (audio) {
    audio.pause();
    audio.currentTime = 0;
  }
  isPlaying = false;
  showScreen('home');
}

// Register service worker for offline
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
