<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meditate">
<meta name="theme-color" content="#0a0a1a">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Meditate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a1a;
    --bg-soft: #11112a;
    --card-bg: rgba(255,255,255,0.05);
    --card-bg-hover: rgba(255,255,255,0.09);
    --card-border: rgba(255,255,255,0.08);
    --text: #ebe4f3;
    --text-dim: #9b91b0;
    --text-faint: #5d5872;
    --accent: #b388ff;
    --accent-soft: rgba(179,136,255,0.18);
    --accent-glow: rgba(179,136,255,0.35);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* category accent colors */
    --c-cleansing: #b388ff;
    --c-breath: #82e9ff;
    --c-frequency: #ffb86b;
    --c-ra: #ff80c0;
    --c-extracts: #7eecc0;
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Animated background glows */
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(110,70,180,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 100% 80%, rgba(60,40,120,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 0% 90%, rgba(80,50,150,0.15) 0%, transparent 60%);
  }

  .screen {
    display: none;
    min-height: 100vh; min-height: 100dvh;
    position: relative; z-index: 1;
  }
  .screen.active { display: block; }

  /* ───── HOME ───── */
  .home {
    padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 60px);
    max-width: 720px; margin: 0 auto;
  }

  .home-header {
    text-align: center;
    padding: 28px 0 20px;
  }
  .lotus {
    font-size: 56px; display: inline-block;
    filter: drop-shadow(0 4px 20px var(--accent-glow));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .home-header h1 {
    font-family: 'Lora', serif;
    font-size: 56px; font-weight: 700; letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
    margin-top: 14px;
    background: linear-gradient(135deg, #ebe4f3 0%, #b388ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .home-header p {
    color: var(--text-dim); margin-top: 6px;
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
  }

  /* Categories */
  .category {
    margin-bottom: 32px;
  }
  .category-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding: 0 4px;
  }
  .category-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cat-color, var(--accent));
    box-shadow: 0 0 12px var(--cat-color, var(--accent));
  }
  .category-title {
    font-family: 'Lora', serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--text-dim);
  }
  .category-count {
    color: var(--text-faint); font-size: 12px;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  .cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 540px) { .cards { grid-template-columns: 1fr 1fr; } }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 18px 18px 16px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; gap: 14px;
    min-height: 76px;
    text-align: left;
    -webkit-user-select: none; user-select: none;
  }
  .card:hover { background: var(--card-bg-hover); border-color: rgba(255,255,255,0.14); }
  .card:active { transform: scale(0.98); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card-icon {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, var(--cat-color, var(--accent)) 0%, rgba(255,255,255,0.05) 100%);
    background-blend-mode: overlay;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .card-icon.cat-cleansing { background: linear-gradient(135deg, rgba(179,136,255,0.4), rgba(179,136,255,0.08)); }
  .card-icon.cat-breath    { background: linear-gradient(135deg, rgba(130,233,255,0.4), rgba(130,233,255,0.08)); }
  .card-icon.cat-frequency { background: linear-gradient(135deg, rgba(255,184,107,0.4), rgba(255,184,107,0.08)); }
  .card-icon.cat-ra        { background: linear-gradient(135deg, rgba(255,128,192,0.4), rgba(255,128,192,0.08)); }
  .card-icon.cat-extracts  { background: linear-gradient(135deg, rgba(126,236,192,0.4), rgba(126,236,192,0.08)); }

  /* Download button on card */
  .card-dl {
    position: relative;
    width: 44px; height: 44px;
    flex-shrink: 0;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 50%;
    color: var(--text-faint);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s, background 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .card-dl:hover { color: var(--text-dim); background: var(--card-bg-hover); }
  .card-dl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card-dl svg { width: 18px; height: 18px; }
  .card-dl.is-cached { color: var(--accent); }
  .card-dl.is-cached:hover { color: #ff8a8a; }   /* hint at delete on hover */
  .card-dl.is-cached:hover .dl-icon-check { display: none; }
  .card-dl.is-cached:hover .dl-icon-trash { display: block; }
  .card-dl.is-busy { color: var(--accent); }
  .dl-icon-cloud, .dl-icon-check, .dl-icon-trash, .dl-icon-spinner { display: none; }
  .card-dl.is-idle   .dl-icon-cloud   { display: block; }
  .card-dl.is-busy   .dl-icon-spinner { display: block; animation: spin 1.2s linear infinite; }
  .card-dl.is-cached .dl-icon-check   { display: block; }
  .dl-icon-trash { /* shown only on hover when cached */ }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dl-ring {
    position: absolute; inset: 0;
    pointer-events: none;
    transform: rotate(-90deg);
  }
  .dl-ring circle {
    fill: none;
    stroke-width: 2;
    cx: 22; cy: 22; r: 19;
  }
  .dl-ring .track { stroke: rgba(255,255,255,0.06); }
  .dl-ring .fill {
    stroke: var(--accent);
    stroke-linecap: round;
    stroke-dasharray: 119.4;        /* 2π × 19 ≈ 119.4 */
    stroke-dashoffset: 119.4;
    transition: stroke-dashoffset 0.18s linear;
  }

  /* ───── Continue / hero row ───── */
  .continue-row {
    background: linear-gradient(135deg, rgba(179,136,255,0.18) 0%, rgba(110,70,180,0.12) 60%, rgba(255,128,192,0.10) 100%);
    border: 1px solid rgba(179,136,255,0.22);
    border-radius: 22px;
    padding: 18px 18px 16px;
    margin: 0 0 28px;
    display: flex; align-items: center; gap: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .continue-row:hover { background: linear-gradient(135deg, rgba(179,136,255,0.22) 0%, rgba(110,70,180,0.16) 60%, rgba(255,128,192,0.14) 100%); }
  .continue-row:active { transform: scale(0.98); }
  .continue-eyebrow {
    font-family: 'Lora', serif;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .continue-icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; flex-shrink: 0;
  }
  .continue-body { flex: 1; min-width: 0; }
  .continue-title {
    font-family: 'Lora', serif;
    font-size: 17px; font-weight: 500;
    line-height: 1.2; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .continue-meta {
    font-size: 12px; color: var(--text-dim);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .continue-play {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, #8b66e0 100%);
    border: none; color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .continue-play svg { width: 18px; height: 18px; fill: currentColor; }
  .continue-progress {
    height: 3px; background: rgba(255,255,255,0.07);
    border-radius: 2px; overflow: hidden;
    margin-top: 10px;
  }
  .continue-progress > div {
    height: 100%; background: var(--accent);
    border-radius: 2px;
  }

  /* ───── Mini-player ───── */
  .mini-player {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(var(--safe-bottom) + 12px);
    background: rgba(20, 20, 40, 0.85);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 10px 12px 10px 14px;
    display: flex; align-items: center; gap: 12px;
    max-width: 640px; margin: 0 auto;
    z-index: 100;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    transform: translateY(140%);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
    pointer-events: none;
  }
  .mini-player.shown {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .mini-player::after {
    content: ''; position: absolute; left: 12px; right: 12px; bottom: 2px;
    height: 2px; background: rgba(255,255,255,0.06); border-radius: 1px;
    overflow: hidden;
  }
  .mini-progress {
    position: absolute; left: 12px; bottom: 2px; height: 2px;
    width: 0%; background: var(--accent); border-radius: 1px;
    z-index: 1; transition: width 0.3s linear;
  }
  .mini-emoji { font-size: 28px; flex-shrink: 0; line-height: 1; }
  .mini-info { flex: 1; min-width: 0; cursor: pointer; }
  .mini-title { font-size: 13px; font-weight: 500; line-height: 1.2; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .mini-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .mini-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.08);
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .mini-btn.play { background: var(--accent); color: #fff; }
  .mini-btn:active { transform: scale(0.94); }
  .mini-btn svg { width: 16px; height: 16px; }
  .mini-btn.play svg { width: 18px; height: 18px; fill: currentColor; }

  /* Reserve space for mini-player on home so cards don't get hidden */
  body.mini-shown .home { padding-bottom: calc(var(--safe-bottom) + 100px); }

  /* Breathing dot during playback */
  .breath-dot {
    position: fixed; left: 50%; bottom: 8%; transform: translate(-50%, 0);
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 24px var(--accent-glow);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.4s;
  }
  body.breath-on .breath-dot {
    opacity: 0.6;
    animation: breath 7.318s ease-in-out infinite; /* 4-7 breath rhythm */
  }
  @keyframes breath {
    0%   { transform: translate(-50%, 0) scale(0.6); }
    27%  { transform: translate(-50%, 0) scale(1.3); }  /* inhale 2s */
    100% { transform: translate(-50%, 0) scale(0.6); }  /* exhale slow */
  }
  @media (prefers-reduced-motion: reduce) {
    body.breath-on .breath-dot { animation: none; opacity: 0.4; transform: translate(-50%, 0) scale(1); }
  }

  /* iOS install banner */
  .install-banner {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(var(--safe-bottom) + 12px);
    background: rgba(30, 26, 56, 0.95);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 16px;
    display: none;
    z-index: 200;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    max-width: 460px; margin: 0 auto;
    font-size: 13px; color: var(--text);
    line-height: 1.4;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .install-banner.shown { display: block; }
  .install-banner b { color: var(--accent); font-weight: 600; }
  .install-banner-close {
    position: absolute; right: 10px; top: 10px;
    width: 28px; height: 28px;
    background: none; border: none; color: var(--text-faint);
    cursor: pointer; font-size: 18px; line-height: 1;
  }
  .install-banner-action {
    background: linear-gradient(135deg, var(--accent) 0%, #8b66e0 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .install-banner-action:active { transform: scale(0.97); }

  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-family: 'Lora', serif;
    font-size: 17px; font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .card-desc {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.45;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .card-meta {
    font-size: 11px; color: var(--text-faint);
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  /* ───── PLAYER ───── */
  .player {
    padding: calc(var(--safe-top) + 16px) 20px calc(var(--safe-bottom) + 30px);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
  }

  .player-topbar {
    align-self: stretch;
    display: flex; align-items: center;
    margin-bottom: 8px;
  }

  .icon-btn {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--card-bg-hover); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 20px; height: 20px; }

  .player-content {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    flex: 1;
    justify-content: center;
    text-align: center;
  }

  .player-visual {
    width: 240px; height: 240px;
    margin: 32px auto 28px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .player-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--accent-soft);
  }
  .player-ring.pulse { animation: pulse 4.5s ease-in-out infinite; }
  .player-ring:nth-child(2) { animation-delay: -1.5s; }
  .player-ring:nth-child(3) { animation-delay: -3s; }
  @keyframes pulse {
    0%, 100% { transform: scale(0.92); opacity: 0.25; }
    50%      { transform: scale(1.15); opacity: 0.7; }
  }
  .player-emoji {
    font-size: 88px; position: relative; z-index: 1;
    filter: drop-shadow(0 4px 24px var(--accent-glow));
  }
  @media (prefers-reduced-motion: reduce) {
    .player-ring.pulse { animation: none; opacity: 0.4; }
    .lotus { animation: none; }
  }

  .player-title {
    font-family: 'Lora', serif;
    font-size: 22px; font-weight: 500;
    margin: 0 8px 4px;
    line-height: 1.25;
  }
  .player-subtitle {
    color: var(--text-dim); font-size: 13px;
    line-height: 1.5; max-width: 340px;
    padding: 0 8px;
  }

  /* Progress */
  .progress-row {
    align-self: stretch;
    margin: 36px 0 8px;
  }
  .progress-bar {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
  }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--accent) 0%, #d6b3ff 100%);
    width: 0%;
    border-radius: 2px;
    transition: width 0.2s linear;
  }
  .progress-thumb {
    position: absolute; top: 50%;
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 12px var(--accent-glow);
    opacity: 0;
    transition: opacity 0.2s;
    left: 0%;
  }
  .progress-row:hover .progress-thumb,
  .progress-row.active .progress-thumb { opacity: 1; }

  .progress-times {
    display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--text-faint);
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  /* Controls */
  .controls {
    display: flex; gap: 20px;
    align-items: center; justify-content: center;
    margin: 18px 0 24px;
  }
  .ctrl {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 50%;
    width: 58px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    transition: background 0.2s, transform 0.1s;
  }
  .ctrl:hover { background: var(--card-bg-hover); }
  .ctrl:active { transform: scale(0.92); }
  .ctrl.play {
    width: 76px; height: 76px;
    background: linear-gradient(135deg, var(--accent) 0%, #8b66e0 100%);
    border: none;
    color: white;
    box-shadow: 0 4px 24px var(--accent-glow);
  }
  .ctrl svg { width: 22px; height: 22px; }
  .ctrl.play svg { width: 28px; height: 28px; }

  /* Lower toolbar (volume / loop) */
  .player-toolbar {
    align-self: stretch;
    display: flex; flex-direction: column; gap: 14px;
    margin-top: 12px;
  }
  .toolbar-row {
    display: flex; align-items: center; gap: 12px;
  }
  .toolbar-row svg { width: 18px; height: 18px; color: var(--text-dim); flex-shrink: 0; }

  input[type=range].vol {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.1);
    outline: none;
  }
  input[type=range].vol::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 0 0 4px rgba(179,136,255,0.15);
  }
  input[type=range].vol::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: none;
  }

  .toggle-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card-bg); border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 8px 14px; border-radius: 999px;
    cursor: pointer; font-size: 12px; font-weight: 500;
    letter-spacing: 1px; text-transform: uppercase;
    transition: all 0.2s;
    min-height: 36px;
    -webkit-user-select: none; user-select: none;

</style>
</head>

const sessionsById = Object.fromEntries(SESSIONS.map(s => [s.id, s]));

// ───── RENDER ─────
function renderCategories() {
  const host = document.getElementById('categories-host');
  host.innerHTML = '';

  for (const cat of CATEGORIES) {
    const items = SESSIONS.filter(s => s.cat === cat.id);
    if (items.length === 0) continue;

    const section = document.createElement('section');
    section.className = 'category';
    section.style.setProperty('--cat-color', cat.color);
    section.innerHTML = `
      <div class="category-header">
        <span class="category-dot"></span>
        <span class="category-title">${cat.label}</span>
        <span class="category-count">${items.length}</span>
      </div>
      <div class="cards"></div>
    `;
    const cards = section.querySelector('.cards');
    for (const s of items) {
      const wrap = document.createElement('div');
      wrap.className = 'card';
      wrap.setAttribute('role', 'button');
      wrap.tabIndex = 0;
      wrap.addEventListener('click', ev => {
        if (ev.target.closest('.card-dl')) return; // download button has its own handler
        selectSession(s.id);
      });
      wrap.addEventListener('keydown', ev => {
        if ((ev.key === 'Enter' || ev.key === ' ') && !ev.target.closest('.card-dl')) {
          ev.preventDefault();
          selectSession(s.id);
        }
      });
      wrap.innerHTML = `
        <span class="card-icon cat-${cat.id}" aria-hidden="true">${s.emoji}</span>
        <div class="card-body">
          <div class="card-title">${s.title}</div>
          <div class="card-desc">${s.desc}</div>
          <div class="card-meta">${s.duration}</div>
        </div>
        <button class="card-dl is-idle" type="button"
          data-session="${s.id}" aria-label="Descargar para offline">
          <svg class="dl-ring" viewBox="0 0 44 44" aria-hidden="true">
            <circle class="track"></circle>
            <circle class="fill"></circle>
          </svg>
          <svg class="dl-icon-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <svg class="dl-icon-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
            <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
          </svg>
          <svg class="dl-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>

          <svg class="dl-icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/>

  // Wire download buttons + reflect cached state

// ───── PLAYER ─────
let current = null;
let audio = null;
let isPlaying = false;
let loopOn = true;
let sleepTimerMs = 0;
let sleepDeadline = 0;
let sleepInterval = null;
const SLEEP_STEPS = [0, 10 * 60, 20 * 60, 30 * 60, 45 * 60, 60 * 60]; // seconds

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function fmt(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ───── Resume positions ─────
const RESUME_KEY = 'meditate.resume.v1';
const LAST_PLAYED_KEY = 'meditate.lastPlayed.v1';

function loadResume() {
  try { return JSON.parse(localStorage.getItem(RESUME_KEY) || '{}'); }
  catch { return {}; }
}
function saveResume(map) {
  try { localStorage.setItem(RESUME_KEY, JSON.stringify(map)); } catch {}
}
function getResume(id) {
  const m = loadResume();
  const entry = m[id];
  return entry && typeof entry.t === 'number' ? entry : null;
}
function setResume(id, t, dur) {
  const m = loadResume();
  // Drop if near start or near end (treat as fresh)
  if (t < 5 || (dur && t > dur - 10)) { delete m[id]; }
  else { m[id] = { t, dur: dur || 0, at: Date.now() }; }
  saveResume(m);
}
function clearResume(id) {
  const m = loadResume();
  delete m[id];
  saveResume(m);
}
function markLastPlayed(id) {
  try { localStorage.setItem(LAST_PLAYED_KEY, id); } catch {}
}
function getLastPlayed() {
  try { return localStorage.getItem(LAST_PLAYED_KEY); } catch { return null; }
}

let lastResumeSave = 0;
function maybeSaveResume() {
  const now = performance.now();
  if (now - lastResumeSave < 3000) return;
  if (current && audio && audio.duration) {
    setResume(current.id, audio.currentTime, audio.duration);
    lastResumeSave = now;
  }
}

function selectSession(id, autoplay = false) {
  current = sessionsById[id];
  if (!current) return;
  markLastPlayed(id);

  document.getElementById('p-emoji').textContent = current.emoji;
  document.getElementById('p-title').textContent = current.title;
  document.getElementById('p-sub').textContent = current.desc;
  document.getElementById('p-current').textContent = '00:00';
  document.getElementById('p-duration').textContent = '--:--';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-thumb').style.left = '0%';
  document.getElementById('loading-msg').textContent = '';
  setPlayIcon(false);

  if (audio) { audio.pause(); audio.src = ''; }
  audio = new Audio(current.file);
  audio.volume = document.getElementById('vol-slider').value / 100;
  audio.loop = loopOn;
  audio.preload = 'auto';

  // Mini-player metadata
  document.getElementById('mini-emoji').textContent = current.emoji;
  document.getElementById('mini-title').textContent = current.title;
  document.getElementById('mini-meta').textContent = current.duration;

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('p-duration').textContent = fmt(audio.duration);
    // Restore position if any
    const r = getResume(current.id);
    if (r && r.t > 5 && r.t < audio.duration - 10) {
      audio.currentTime = r.t;
    }
    updateMediaSession();
  });
  audio.addEventListener('timeupdate', () => {
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-thumb').style.left = pct + '%';
    document.getElementById('p-current').textContent = fmt(audio.currentTime);
    document.getElementById('mini-progress').style.width = pct + '%';
    document.getElementById('mini-meta').textContent =
      `${fmt(audio.currentTime)} / ${fmt(audio.duration || 0)}`;
    maybeSaveResume();
    if (navigator.mediaSession && navigator.mediaSession.setPositionState && audio.duration) {
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: 1,
          position: audio.currentTime,
        });
      } catch {}
    }
  });
  audio.addEventListener('ended', () => {
    if (!loopOn) {
      isPlaying = false;
      setPlayIcon(false);
      clearResume(current.id);     // finished — wipe so it shows fresh next time
      document.body.classList.remove('breath-on');
    }
  });
  audio.addEventListener('error', () => {
    document.getElementById('loading-msg').textContent = 'No se pudo cargar el audio.';
  });
  audio.addEventListener('pause', () => maybeSaveResume());

  isPlaying = false;
  showScreen('player');
  showMini(false);   // hide mini while full player is open

  if (autoplay) {
    // Wait a tick so audio element settles
    setTimeout(() => togglePlay(), 50);
  }
}

function setPlayIcon(playing) {
  const icon = document.getElementById('play-icon');
  document.getElementById('play-btn').setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir');
  icon.innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="6 4 20 12 6 20 6 4"/>';
  const mini = document.getElementById('mini-play-icon');
  mini.innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="6 4 20 12 6 20 6 4"/>';
  document.getElementById('mini-play').setAttribute('aria-label', playing ? 'Pausa' : 'Reproducir');
  document.body.classList.toggle('breath-on', playing);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
}

function hapticTick(ms = 10) {
  if (navigator.vibrate) try { navigator.vibrate(ms); } catch {}
}

function togglePlay() {
  if (!audio || !current) return;
  hapticTick();
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    setPlayIcon(false);
    maybeSaveResume();
  } else {
    document.getElementById('loading-msg').textContent = 'Cargando audio…';
    const p = audio.play();
    if (p !== undefined) {
      p.then(() => {
        document.getElementById('loading-msg').textContent = '';
        isPlaying = true;
        setPlayIcon(true);
      }).catch(() => {
        document.getElementById('loading-msg').textContent = 'Toca play de nuevo';
        isPlaying = false;
      });
    }
  }
}

function seekBy(delta) {
  if (!audio) return;
  audio.currentTime = Math.max(0, Math.min((audio.duration || 0), audio.currentTime + delta));
  maybeSaveResume();
}

function setVolume(val) { if (audio) audio.volume = val / 100; }

// Back arrow on player → minimize to home, keep audio playing
function minimizeToHome() {
  hapticTick(6);
  showScreen('home');
  if (audio && current) {
    showMini(true);
    renderContinue();   // refresh hero (in case position changed)
  }
}

// Stop button on mini-player (or completion) → stop audio, hide mini
function stopAndBack(fromMini = false) {
  if (audio) {
    maybeSaveResume();
    audio.pause();
  }
  isPlaying = false;
  setPlayIcon(false);
  document.body.classList.remove('breath-on');
  cancelSleep();
  showMini(false);
  if (!fromMini) showScreen('home');
}

// Mini-player visibility helper
function showMini(on) {
  const el = document.getElementById('mini-player');
  el.classList.toggle('shown', !!on);
  document.body.classList.toggle('mini-shown', !!on);
}

function toggleLoop() {
  loopOn = !loopOn;
  if (audio) audio.loop = loopOn;
  const btn = document.getElementById('loop-btn');
  btn.classList.toggle('active', loopOn);
  btn.setAttribute('aria-pressed', String(loopOn));
}

function cycleTimer() {
  const idx = SLEEP_STEPS.indexOf(sleepTimerMs / 1000);
  const next = SLEEP_STEPS[(idx + 1) % SLEEP_STEPS.length];
  sleepTimerMs = next * 1000;
  if (sleepInterval) { clearInterval(sleepInterval); sleepInterval = null; }
  const btn = document.getElementById('timer-btn');
  btn.classList.toggle('active', sleepTimerMs > 0);
  if (sleepTimerMs === 0) {
    document.getElementById('timer-label').textContent = 'Sleep · Off';
    return;
  }
  sleepDeadline = Date.now() + sleepTimerMs;
  updateSleepLabel();
  sleepInterval = setInterval(() => {
    const remaining = sleepDeadline - Date.now();
    if (remaining <= 0) {
      clearInterval(sleepInterval); sleepInterval = null;
      if (audio && isPlaying) togglePlay();
      sleepTimerMs = 0;
      btn.classList.remove('active');
      document.getElementById('timer-label').textContent = 'Sleep · Off';
      return;
    }
    updateSleepLabel();
  }, 1000);
}

function cancelSleep() {
  if (sleepInterval) { clearInterval(sleepInterval); sleepInterval = null; }
  sleepTimerMs = 0;
  const btn = document.getElementById('timer-btn');
  btn.classList.remove('active');
  document.getElementById('timer-label').textContent = 'Sleep · Off';
}

function updateSleepLabel() {
  const remaining = Math.max(0, Math.floor((sleepDeadline - Date.now()) / 1000));
  document.getElementById('timer-label').textContent = 'Sleep · ' + fmt(remaining);
}

// Progress bar seek
const progressBar = document.getElementById('progress-bar');
function seekFromEvent(ev) {
  if (!audio || !audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
  const pct = Math.max(0, Math.min(1, x / rect.width));
  audio.currentTime = pct * audio.duration;
}
progressBar.addEventListener('click', seekFromEvent);

// ───── OFFLINE DOWNLOADS ─────
const AUDIO_CACHE_NAME = 'meditate-audio-v2';
const dlState = new Map(); // sessionId → 'cached' | { progress: 0..1 } | undefined

async function refreshDownloadStates() {
  if (!('caches' in window)) return;
  try {
    const cache = await caches.open(AUDIO_CACHE_NAME);
    for (const s of SESSIONS) {
      const match = await cache.match(s.file);
      if (match && dlState.get(s.id) !== 'cached') {
        dlState.set(s.id, 'cached');
      }
    }
    for (const btn of document.querySelectorAll('.card-dl')) {
      paintDownloadBtn(btn);
    }
  } catch (e) { /* ignore */ }
}

function paintDownloadBtn(btn) {
  const id = btn.dataset.session;
  const state = dlState.get(id);
  btn.classList.remove('is-idle', 'is-busy', 'is-cached');
  const fill = btn.querySelector('.dl-ring .fill');
  if (state === 'cached') {
    btn.classList.add('is-cached');
    btn.setAttribute('aria-label', 'Eliminar descarga');
    fill.style.strokeDashoffset = 119.4;
  } else if (state && typeof state.progress === 'number') {
    btn.classList.add('is-busy');
    btn.setAttribute('aria-label', `Descargando ${Math.round(state.progress * 100)}%`);
    fill.style.strokeDashoffset = 119.4 * (1 - state.progress);
  } else {
    btn.classList.add('is-idle');
    btn.setAttribute('aria-label', 'Descargar para offline');
    fill.style.strokeDashoffset = 119.4;
  }
}

async function onDownloadClick(ev) {
  ev.stopPropagation();
  const btn = ev.currentTarget;
  const id = btn.dataset.session;
  const session = sessionsById[id];
  if (!session) return;

  const state = dlState.get(id);

  if (state === 'cached') {
    if (!confirm(`¿Eliminar "${session.title}" del almacenamiento offline?`)) return;
    try {
      const cache = await caches.open(AUDIO_CACHE_NAME);
      await cache.delete(session.file);
      dlState.delete(id);
      paintDownloadBtn(btn);
    } catch (e) { console.error(e); }
    return;
  }

  if (state && typeof state.progress === 'number') return; // already running

  dlState.set(id, { progress: 0 });
  paintDownloadBtn(btn);

  try {
    const resp = await fetch(session.file);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const total = parseInt(resp.headers.get('content-length') || '0', 10);
    const reader = resp.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total > 0) {
        dlState.set(id, { progress: received / total });
        paintDownloadBtn(btn);
      }
    }
    const blob = new Blob(chunks, { type: 'audio/mpeg' });
    const cache = await caches.open(AUDIO_CACHE_NAME);
    await cache.put(session.file, new Response(blob, {
      headers: { 'Content-Type': 'audio/mpeg', 'Content-Length': String(blob.size) }
    }));
    dlState.set(id, 'cached');
    paintDownloadBtn(btn);
  } catch (err) {
    console.error('Download failed:', err);
    dlState.delete(id);
    paintDownloadBtn(btn);
    alert(`No se pudo descargar "${session.title}". Verifica tu conexión.`);
  }
}

// ───── Continue row ─────
function renderContinue() {
  const host = document.getElementById('continue-host');
  const id = getLastPlayed();
  const session = id ? sessionsById[id] : null;
  if (!session) { host.innerHTML = ''; return; }
  const r = getResume(id);
  const t = r ? r.t : 0;
  const dur = r ? (r.dur || 0) : 0;
  const remaining = dur > 0 ? Math.max(0, dur - t) : 0;
  const pct = dur > 0 ? (t / dur) * 100 : 0;
  const metaText = dur && t > 5
    ? `${fmt(t)} de ${fmt(dur)} · faltan ${fmt(remaining)}`
    : session.duration;

  host.innerHTML = `
    <div class="continue-row" id="continue-card" role="button" tabindex="0" aria-label="Continuar ${session.title}">
      <div class="continue-icon">${session.emoji}</div>
      <div class="continue-body">
        <div class="continue-eyebrow">${t > 5 ? 'Continúa' : 'Última escuchada'}</div>
        <div class="continue-title">${session.title}</div>
        <div class="continue-meta">${metaText}</div>
        ${pct > 0 ? `<div class="continue-progress"><div style="width:${pct}%"></div></div>` : ''}
      </div>
      <button class="continue-play" type="button" aria-label="Reproducir">
        <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      </button>
    </div>
  `;
  const card = host.querySelector('#continue-card');
  card.addEventListener('click', () => selectSession(id, true));
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSession(id, true); }
  });
}

// Mini-player click → re-expand player screen
document.getElementById('mini-info').addEventListener('click', () => {
  if (current) showScreen('player');
});

// ───── Media Session API (lock-screen / Control Center controls) ─────
function updateMediaSession() {
  if (!('mediaSession' in navigator) || !current) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: current.title,
      artist: current.desc,
      album: 'Meditate',
      artwork: [{ src: 'icon.svg', sizes: '512x512', type: 'image/svg+xml' }],
    });
    navigator.mediaSession.setActionHandler('play',           () => { if (!isPlaying) togglePlay(); });
    navigator.mediaSession.setActionHandler('pause',          () => { if (isPlaying)  togglePlay(); });
    navigator.mediaSession.setActionHandler('seekbackward',   d => seekBy(-(d.seekOffset || 15)));
    navigator.mediaSession.setActionHandler('seekforward',    d => seekBy( (d.seekOffset || 15)));
    navigator.mediaSession.setActionHandler('seekto',         d => { if (audio && typeof d.seekTime === 'number') audio.currentTime = d.seekTime; });
    navigator.mediaSession.setActionHandler('stop',           () => stopAndBack(true));
  } catch {}
}

// ───── Install hint (iOS Safari manual + Chrome/Edge native) ─────
const INSTALL_DISMISSED_KEY = 'meditate.installDismissed.v1';
let deferredInstallPrompt = null;

// Chrome/Edge/Android: capture the native prompt
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Show banner with native install button (if not dismissed and not already standalone)
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const dismissed = localStorage.getItem(INSTALL_DISMISSED_KEY) === '1';
  if (!standalone && !dismissed) {
    document.getElementById('install-text-chromium').style.display = '';
    document.getElementById('install-text-ios').style.display = 'none';
    setTimeout(() => document.getElementById('install-banner').classList.add('shown'), 800);
  }
});

// Already-installed event — never show again
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('shown');
  try { localStorage.setItem(INSTALL_DISMISSED_KEY, '1'); } catch {}
  deferredInstallPrompt = null;
});

async function triggerNativeInstall() {
  if (!deferredInstallPrompt) return;
  try {
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('install-banner').classList.remove('shown');
    if (choice.outcome === 'dismissed') {
      // user dismissed native prompt — remember so we don't nag
      try { localStorage.setItem(INSTALL_DISMISSED_KEY, '1'); } catch {}
    }
  } catch (e) { console.error(e); }
}
window.triggerNativeInstall = triggerNativeInstall;

// iOS Safari fallback (no beforeinstallprompt support)
function maybeShowInstallBanner() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const dismissed = localStorage.getItem(INSTALL_DISMISSED_KEY) === '1';
  if (isIOS && !standalone && !dismissed) {
    document.getElementById('install-text-ios').style.display = '';
    document.getElementById('install-text-chromium').style.display = 'none';
    setTimeout(() => document.getElementById('install-banner').classList.add('shown'), 1200);
  }
  // Chrome/Edge/Android: the banner appears via beforeinstallprompt handler above
}

function dismissInstallBanner() {
  document.getElementById('install-banner').classList.remove('shown');
  try { localStorage.setItem(INSTALL_DISMISSED_KEY, '1'); } catch {}
}
window.dismissInstallBanner = dismissInstallBanner;

// Save position on tab hide / pagehide
document.addEventListener('visibilitychange', () => {
  if (document.hidden) maybeSaveResume();
});
window.addEventListener('pagehide', () => maybeSaveResume());

// Initial render
renderContinue();
renderCategories();
maybeShowInstallBanner();

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => refreshDownloadStates())
    .catch(() => {});
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshDownloadStates();
});
</script>
